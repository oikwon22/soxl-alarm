name: Daily SOXL Defense Signal & Realtime Web Update

on:
  schedule:
    # Daily Auto-Run at 21:00 UTC (13:00 EST / 22:30 KST)
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Enables REALTIME ON-DEMAND EXECUTION anytime via web button!

jobs:
  update-realtime-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas yfinance

      - name: Calculate Realtime SOXL Defense Signal
        run: |
          python soxl_vlem_term_ladder_backtest/soxl_defense_github_summary.py

      - name: Push Updated Signal to README
        run: |
          git config --global user.name "oikwon22-git"
          git config --global user.email "khjjd.family@gmail.com"
          git add README.md
          git commit -m "Realtime Auto-Update SOXL Defense Signal" || exit 0
          git push
