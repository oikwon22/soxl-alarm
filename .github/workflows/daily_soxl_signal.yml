name: Daily SOXL Defense Signal & Web README Update

on:
  schedule:
    # Runs every weekday at 21:00 UTC (13:00 EST / 22:30 KST - 1 hour before US Market Open)
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub web anytime!

jobs:
  run-signal-and-update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas yfinance

      - name: Generate Today's Defense Signal README.md
        run: |
          python soxl_vlem_term_ladder_backtest/soxl_defense_github_summary.py

      - name: Commit and Push Updated README to GitHub Web
        run: |
          git config --global user.name "oikwon22-git"
          git config --global user.email "khjjd.family@gmail.com"
          git add README.md
          git commit -m "Auto-update today's SOXL Defense Signal" || exit 0
          git push
